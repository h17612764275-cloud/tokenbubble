name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS Apple Silicon target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Token Bubble 余量浮窗 v__VERSION__
          releaseBody: |
            ## What's new

            - Uses cloud height alone to represent remaining quota, keeping non-empty clouds equally white and dense instead of exposing more of the gray base at lower levels.
            - Brightens the cloud layer, increases its coverage, and tightens the top fade so values such as 44% stay easier to read.
            - Preserves the soft pink-purple glass appearance while improving contrast and edge clarity.

            ![Token Bubble panel](https://raw.githubusercontent.com/h17612764275-cloud/token-bubble/main/docs/images/token-bubble-panel.png)

            ## Privacy

            Screenshot capture, annotation, clipboard copy, and pinned-image display stay on-device. Screen pixels are read only after the user starts a capture, and screenshots are never uploaded by Token Bubble.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
